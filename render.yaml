services:
  - type: web
    name: ai20k-lms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MODEL_PROVIDER
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: API_KEY
        sync: false
